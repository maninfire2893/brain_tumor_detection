<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brain Tumor Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #001f3f, #0074D9);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #001f3f;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .navbar a:hover {
      color: #0074D9;
    }

    .container {
      background-color: #ffffff;
      color: #333;
      border-radius: 15px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #001f3f;
      margin-bottom: 20px;
    }

    input, select {
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
    }

    input[type="file"] {
      border: 2px dashed #0074D9;
      cursor: pointer;
    }

    #imagePreview {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    button {
      background-color: #0074D9;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    button:hover {
      background-color: #005fa3;
      transform: scale(1.05);
    }

    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 24px;
      }
    }

    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #001f3f;
      color: white;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>Brain Tumor Detection</h2>
    <a href="/patients">Patient Records</a>
  </div>
  <div class="container">
    <h1>🧠 Brain Tumor Detection</h1>
    <form id="patientForm" enctype="multipart/form-data">
      <input type="text" id="name" name="name" placeholder="Patient Name" required>
      <select id="gender" name="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <input type="text" id="phone" name="phone" placeholder="Phone Number" required>
      <input type="file" id="imageInput" name="image" accept="image/*" onchange="previewImage()" required>
      <img id="imagePreview" alt="MRI Preview"/>
      <br>
      <button type="button" onclick="submitForm()">Analyze MRI</button>
    </form>
    <p id="result"></p>
    <div id="loadingSpinner" style="display: none;">
      <img src="/static/spinner.gif" alt="Loading..." style="width: 50px;">
    </div>
  </div>

  <div class="footer">
    <p>© 2025 Brain Tumor Detection. All rights reserved.</p>
  </div>

  <script>
    function previewImage() {
      const fileInput = document.getElementById('imageInput');
      const preview = document.getElementById('imagePreview');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    async function submitForm() {
      const name = document.getElementById('name').value.trim();
      const gender = document.getElementById('gender').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const imageInput = document.getElementById('imageInput');
      const file = imageInput.files[0];
      const resultEl = document.getElementById('result');
      const spinner = document.getElementById('loadingSpinner');

      resultEl.innerText = "";

      if (!name || !gender || !phone) {
        resultEl.innerText = "❌ Please fill in all the required details.";
        resultEl.style.color = "#e74c3c";
        return;
      }

      if (!file) {
        resultEl.innerText = "❌ Please upload an image.";
        resultEl.style.color = "#e74c3c";
        return;
      }

      spinner.style.display = "block";

      const formData = new FormData();
      formData.append('name', name);
      formData.append('gender', gender);
      formData.append('phone', phone);
      formData.append('image', file);

      try {
        const response = await fetch('http://127.0.0.1:5000/predict', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        resultEl.innerText = data.result === "Tumor Detected"
          ? "⚠️ Tumor Detected"
          : "✅ No Tumor Detected";
        resultEl.style.color = data.result === "Tumor Detected" ? "#c0392b" : "#27ae60";
      } catch (err) {
        console.error(err);
        resultEl.innerText = "❌ Error occurred during prediction.";
        resultEl.style.color = "#e74c3c";
      } finally {
        spinner.style.display = "none";
      }
    }
  </script>
</body>
</html>
