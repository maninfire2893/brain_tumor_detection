<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #001f3f, #0074D9);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    .container {
      background-color: #ffffff;
      color: #333;
      border-radius: 15px;
      padding: 40px;
      max-width: 800px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #001f3f;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 14px;
    }

    table th, table td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }

    table th {
      background-color: #0074D9;
      color: white;
    }

    table tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    table tr:hover {
      background-color: #e6f7ff;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }

    .top-right {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .top-right button {
      background-color: #0074D9;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .top-right button:hover {
      background-color: #005bb5;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="top-right">
    <a href="/">
      <button>Back to Home</button>
    </a>
  </div>
  <div class="container">
    <h1>Patient Details</h1>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Gender</th>
          <th>Phone</th>
          <th>Prediction</th>
          <th>Timestamp</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for patient in patients %}
        <tr id="patient-{{ patient[0] }}">
          <td>{{ patient[0] }}</td>
          <td>{{ patient[1] }}</td>
          <td>{{ patient[2] }}</td>
          <td>{{ patient[3] }}</td>
          <td>{{ patient[5] }}</td>
          <td>{{ patient[6] }}</td>
          <td>
            <button class="delete-btn" onclick="deletePatient('{{ patient[0] }}')">Delete</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    async function deletePatient(patientId) {
      if (!confirm("Are you sure you want to delete this record?")) {
        return;
      }

      try {
        const response = await fetch(`/delete_patient/${patientId}`, {
          method: 'POST'
        });

        if (response.ok) {
          // Remove the row from the table
          const row = document.getElementById(`patient-${patientId}`);
          row.remove();
          alert("Patient record deleted successfully.");
        } else {
          const errorData = await response.json();
          alert(`Error: ${errorData.error}`);
        }
      } catch (err) {
        console.error("Error deleting patient:", err);
        alert("An error occurred while deleting the patient record.");
      }
    }
  </script>
</body>
</html>
